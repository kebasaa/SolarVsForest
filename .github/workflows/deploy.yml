name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deployments to Pages run one at a time and are never cancelled half-way
# (a cancelled deployment can leave Pages stuck); PR checks may cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # actions/configure-pages reads the Pages site configuration
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests (model reproduces the paper's tables)
        run: npm test

      - name: Type check
        run: npm run check

      - name: Cache generated images
        uses: actions/cache@v6
        with:
          path: public/img
          key: img-${{ hashFiles('assets-src/**', 'scripts/photos.config.json', 'scripts/optimize-images.mjs') }}

      - name: Generate responsive images
        run: |
          if [ -z "$(ls -A public/img 2>/dev/null)" ]; then npm run images; else echo "using cached images"; fi

      - name: Build
        run: npm run build

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # the first deployment after enabling Pages can take longer than the 10-minute default
          timeout: 1800000
